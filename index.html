<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/brand/logo.png" />
    <link rel="apple-touch-icon" href="/images/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#063327" />
    <title>Al Iman Rouh Travel</title>
    <style>
      /* Splash shown until React mounts into #root and replaces it. */
      .ra-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(60% 50% at 50% 40%, rgba(198, 160, 74, 0.14), transparent 70%), #f6f7f9;
        font-family: 'Noto Sans', 'Noto Sans Arabic', system-ui, sans-serif;
        color: #063327;
        text-align: center;
      }
      .ra-splash__logo {
        width: min(260px, 64vw);
        height: auto;
        aspect-ratio: 1;
        border-radius: 28px;
        object-fit: contain;
        background: #fff;
        box-shadow: 0 24px 60px rgba(6, 51, 39, 0.14);
        animation: ra-pulse 2.4s ease-in-out infinite;
      }
      @keyframes ra-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.025); }
      }
      .ra-splash__bar {
        position: relative;
        width: 140px;
        height: 3px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(6, 51, 39, 0.1);
      }
      .ra-splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #063327, #c6a04a);
        animation: ra-slide 1.2s ease-in-out infinite;
      }
      @keyframes ra-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ra-splash__logo,
        .ra-splash__bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ra-splash" role="status" aria-live="polite">
        <img class="ra-splash__logo" src="/images/brand/logo-full.jpg" alt="Al Iman Rouh" width="260" height="260" />
        <div class="ra-splash__bar" aria-hidden="true"></div>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
